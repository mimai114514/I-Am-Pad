name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assemble

      # fork 没有上游的签名密钥，这里根据密钥是否存在决定是否签名，
      # 这样没有 secrets 时仍能产出可侧载的 debug APK。
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: echo "available=${ANDROID_SIGNING_KEY:+true}" >> "$GITHUB_OUTPUT"

      - uses: ilharp/sign-android-release@v2
        name: Sign app APK
        id: sign_app
        if: steps.signing.outputs.available == 'true'
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i.am.pad-release apk
          path: app/build/outputs/apk/release/*signed.apk

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i.am.pad-debug apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore